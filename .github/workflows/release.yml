# Build and publish a downloadable release.
#
# Triggered by pushing a tag like `v0.1.0`, or manually from the Actions tab.
# The zip it attaches is built here rather than uploaded by hand, so what people
# download is always what the tagged source produces.

name: Release

on:
  push:
    tags: ['v*']
  # Manual runs take the tag as an input and create it, so a release can be cut
  # without push access to the tag ref.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.1.0'
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Package first: the integration suite loads the built artifacts, and
      # skips itself if they are missing rather than failing loudly.
      - run: npm run package

      - run: npm test

      - name: Check the Firefox build against Mozilla's validator
        run: npx web-ext lint --source-dir dist/firefox

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Umbra ${{ inputs.tag || github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          # Appends the commits since the previous tag, so each release says what
          # actually changed instead of repeating the same standing text.
          generate_release_notes: true
          files: |
            dist/umbra-chrome-*.zip
            dist/umbra-firefox-*.xpi
